name: build-exe

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "*.py"
      - "requirements*.txt"
      - "tests/**"
      - ".github/workflows/**"
  release:
    types: [created]

permissions:
  contents: write

jobs:
  test:
    name: Syntax & unit test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all scripts
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  build:
    name: Generate windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build fixIcon.exe
        run: pyinstaller --onefile --noconfirm --name fixIcon fixIcon.py

      - name: Build FastFixIcon.exe
        run: pyinstaller --onefile --noconfirm --name FastFixIcon FastFixIcon.py

      - name: Smoke test executables
        run: |
          .\dist\FastFixIcon.exe --help | Out-Null
          .\dist\fixIcon.exe --help | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/fixIcon.exe
            dist/FastFixIcon.exe
          if-no-files-found: error

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fixIcon.exe
            dist/FastFixIcon.exe
          fail_on_unmatched_files: true
